[project]
name = "japan-grid-forest-mesh-builder"
version = "1.0.0"
description = "全国公共測量図郭 (1/2,500) & 20m 森林資源メッシュ全自動構築・解析ツール"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "geopandas>=0.12.2",
    "pyogrio>=0.6.0",
    "pyproj>=3.5.0",
    "japan-basic-section>=0.0.1",
    "py7zr>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "shapely>=2.0.0",
    "jinja2>=3.1.0",
    "pillow>=9.0.0",
    "rasterio>=1.3.0"
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

